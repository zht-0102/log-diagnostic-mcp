# log-diagnostic-mcp 的服务器配置示例。
#
# 将本文件复制为 `config/servers.yaml` 并填入真实值。
# `config/servers.yaml` 与 `.env` 已被 gitignore —— 绝不提交真实密钥。
#
# 形如 ${SSH_PRIVATE_KEY} 的值会从环境变量展开
# （由 dotenv 从 .env 加载）。若引用的变量缺失，
# 启动时会立即失败并给出清晰报错。

limits:
  # 单次查询最多搜索的服务器数
  maxServers: 10
  # 单次查询返回的匹配行总数上限
  maxLines: 3000
  # 单台服务器 SSH 命令超时（秒）
  timeoutSeconds: 30
  # 最大并行 SSH 连接数
  maxConcurrentConnections: 5
  # 只扫描每个日志文件的末尾 N 行（绝不读全量历史）
  scanLines: 20000

servers:
  - name: shipping-prod-01
    environment: prod
    host: 192.168.1.10
    port: 22
    username: log-reader
    auth:
      type: private_key
      # 私钥文件路径，从环境变量解析
      privateKeyPath: ${SSH_PRIVATE_KEY}
    logPaths:
      - /data/logs/shipping

  - name: shipping-prod-02
    environment: prod
    host: 192.168.1.11
    port: 22
    username: log-reader
    auth:
      type: private_key
      privateKeyPath: ${SSH_PRIVATE_KEY}
    logPaths:
      - /data/logs/shipping
      - /data/logs/common

  - name: shipping-staging-01
    environment: staging
    host: 192.168.2.10
    port: 22
    username: log-reader
    auth:
      type: private_key
      privateKeyPath: ${SSH_PRIVATE_KEY_STAGING}
    logPaths:
      - /data/logs/shipping
