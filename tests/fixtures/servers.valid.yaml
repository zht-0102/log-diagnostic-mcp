limits:
  maxServers: 3
  timeoutSeconds: 15

servers:
  - name: app-prod-01
    environment: prod
    host: 192.168.1.10
    username: log-reader
    auth:
      type: private_key
      privateKeyPath: ${TEST_SSH_KEY_PATH}
    logPaths:
      - /data/logs/app

  - name: app-staging-01
    environment: staging
    host: 192.168.2.10
    port: 2222
    username: log-reader
    auth:
      type: private_key
      privateKeyPath: ${TEST_SSH_KEY_PATH}
    logPaths:
      - /data/logs/app
      - /data/logs/common
